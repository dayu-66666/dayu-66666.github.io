<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>线索跟进记录</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --bg: #F6F4F1;
    --surface: #FFFFFF;
    --surface-2: #F2EFF4;
    --ink: #221D28;
    --muted: #6E6878;
    --faint: #9A93A6;
    --border: #E6E2E9;
    --accent: #C2266E;
    --accent-ink: #FFFFFF;
    --accent-soft: #FAE3EE;
    --s1-bg: #FBEEDC; --s1-fg: #8A5410; --s1-dot: #D9910F;
    --s2-bg: #E1EEF9; --s2-fg: #1D5E96; --s2-dot: #3E8BC9;
    --s3-bg: #DFF2E5; --s3-fg: #1F6B40; --s3-dot: #37985F;
    --s4-bg: #F5E3F1; --s4-fg: #8A2472; --s4-dot: #B8409C;
    --s5-bg: #ECEAEE; --s5-fg: #6E6878; --s5-dot: #9A93A6;
    --danger: #B3382E;
    --shadow: 0 1px 2px rgba(34,29,40,.05), 0 6px 20px rgba(34,29,40,.06);
    --sticky-bg: rgba(246,244,241,.88);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151218; --surface: #201C26; --surface-2: #2A2533;
      --ink: #EDEAF2; --muted: #A29BAE; --faint: #7A7386; --border: #342E3E;
      --accent: #E0559B; --accent-ink: #1C0A13; --accent-soft: #3A2231;
      --s1-bg: #3A2E17; --s1-fg: #EBB35C; --s1-dot: #D9910F;
      --s2-bg: #1B2C3D; --s2-fg: #7FB6E4; --s2-dot: #3E8BC9;
      --s3-bg: #1B3326; --s3-fg: #7BC99A; --s3-dot: #37985F;
      --s4-bg: #382033; --s4-fg: #DE8FCB; --s4-dot: #B8409C;
      --s5-bg: #2B2731; --s5-fg: #A29BAE; --s5-dot: #7A7386;
      --danger: #E06A60;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
      --sticky-bg: rgba(21,18,24,.88);
    }
  }
  :root[data-theme="light"] {
    --bg: #F6F4F1; --surface: #FFFFFF; --surface-2: #F2EFF4;
    --ink: #221D28; --muted: #6E6878; --faint: #9A93A6; --border: #E6E2E9;
    --accent: #C2266E; --accent-ink: #FFFFFF; --accent-soft: #FAE3EE;
    --s1-bg: #FBEEDC; --s1-fg: #8A5410; --s1-dot: #D9910F;
    --s2-bg: #E1EEF9; --s2-fg: #1D5E96; --s2-dot: #3E8BC9;
    --s3-bg: #DFF2E5; --s3-fg: #1F6B40; --s3-dot: #37985F;
    --s4-bg: #F5E3F1; --s4-fg: #8A2472; --s4-dot: #B8409C;
    --s5-bg: #ECEAEE; --s5-fg: #6E6878; --s5-dot: #9A93A6;
    --danger: #B3382E;
    --shadow: 0 1px 2px rgba(34,29,40,.05), 0 6px 20px rgba(34,29,40,.06);
    --sticky-bg: rgba(246,244,241,.88);
  }
  :root[data-theme="dark"] {
    --bg: #151218; --surface: #201C26; --surface-2: #2A2533;
    --ink: #EDEAF2; --muted: #A29BAE; --faint: #7A7386; --border: #342E3E;
    --accent: #E0559B; --accent-ink: #1C0A13; --accent-soft: #3A2231;
    --s1-bg: #3A2E17; --s1-fg: #EBB35C; --s1-dot: #D9910F;
    --s2-bg: #1B2C3D; --s2-fg: #7FB6E4; --s2-dot: #3E8BC9;
    --s3-bg: #1B3326; --s3-fg: #7BC99A; --s3-dot: #37985F;
    --s4-bg: #382033; --s4-fg: #DE8FCB; --s4-dot: #B8409C;
    --s5-bg: #2B2731; --s5-fg: #A29BAE; --s5-dot: #7A7386;
    --danger: #E06A60;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
    --sticky-bg: rgba(21,18,24,.88);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 15px; line-height: 1.6;
  }
  button, input, select { font-family: inherit; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 14px calc(96px + env(safe-area-inset-bottom)); }

  /* ---- header ---- */
  header.top { padding: 2px 4px 14px; }
  .top h1 { font-size: 24px; font-weight: 800; margin: 0; letter-spacing: .02em; }
  .top h1 .spark { color: var(--accent); }
  .top .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }

  /* ---- sticky toolbar: search + tabs ---- */
  .toolbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--sticky-bg);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    margin: 0 -14px; padding: 10px 14px 10px;
  }
  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 0 12px; margin-bottom: 10px;
  }
  .search svg { flex-shrink: 0; color: var(--faint); }
  .search input {
    flex: 1; border: none; background: none; color: var(--ink);
    font-size: 15px; padding: 11px 0; min-width: 0; outline: none;
  }
  .search input::placeholder { color: var(--faint); }
  .search .clear {
    border: none; background: var(--surface-2); color: var(--muted);
    width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
    font-size: 13px; line-height: 1; display: none; flex-shrink: 0;
  }
  .search.has-q .clear { display: block; }

  nav.tabs {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    margin: 0 -14px; padding: 0 14px;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  .tab {
    border: 1px solid var(--border); background: var(--surface);
    color: var(--muted); border-radius: 999px; padding: 7px 14px;
    font-size: 14px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .tab .n { font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--faint); }
  .tab.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .tab.active .n { color: var(--bg); opacity: .7; }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; }

  /* ---- list & cards ---- */
  .list { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: var(--shadow); overflow: hidden;
  }
  .card.starred { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .card-main { padding: 13px 14px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; }
  .avatar {
    width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px; font-weight: 700;
    text-shadow: 0 1px 2px rgba(0,0,0,.18);
  }
  .card-body { flex: 1; min-width: 0; }
  .card-row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .lead-name { font-size: 16.5px; font-weight: 700; }
  .pill {
    font-size: 12px; font-weight: 600; border-radius: 999px;
    padding: 2px 9px; display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; }
  .pill.s1 { background: var(--s1-bg); color: var(--s1-fg); } .pill.s1 .dot { background: var(--s1-dot); }
  .pill.s2 { background: var(--s2-bg); color: var(--s2-fg); } .pill.s2 .dot { background: var(--s2-dot); }
  .pill.s3 { background: var(--s3-bg); color: var(--s3-fg); } .pill.s3 .dot { background: var(--s3-dot); }
  .pill.s4 { background: var(--s4-bg); color: var(--s4-fg); } .pill.s4 .dot { background: var(--s4-dot); }
  .pill.s5 { background: var(--s5-bg); color: var(--s5-fg); } .pill.s5 .dot { background: var(--s5-dot); }
  .card-row2 { color: var(--muted); font-size: 13px; margin-top: 3px; display: flex; gap: 12px; flex-wrap: wrap; }
  .card-row2 .src { color: var(--faint); }
  .note-preview {
    color: var(--faint); font-size: 13px; margin-top: 5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .note-preview b { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .btn-star {
    border: none; background: none; cursor: pointer; flex-shrink: 0;
    font-size: 20px; line-height: 1; padding: 4px; color: var(--border); align-self: center;
  }
  .btn-star.on { color: #E8A213; }

  /* ---- card detail ---- */
  .card-detail { border-top: 1px solid var(--border); background: var(--surface-2); padding: 12px 14px 14px; }
  .contact-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 14px; margin-bottom: 10px; color: var(--muted);
  }
  .contact-row .val { color: var(--ink); font-weight: 600; word-break: break-all; }
  .btn-copy {
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    border-radius: 8px; padding: 3px 10px; font-size: 12.5px; cursor: pointer;
  }
  .detail-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .detail-bar label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  select.status-select {
    font-size: 14px; padding: 6px 8px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  }
  .detail-bar .spacer { flex: 1; }
  .btn-mini {
    border: none; background: none; color: var(--faint); font-size: 13px;
    cursor: pointer; padding: 5px 8px; border-radius: 8px;
  }
  .btn-mini:hover { color: var(--ink); background: var(--surface); }
  .btn-mini.confirming { color: var(--danger); font-weight: 600; background: var(--surface); outline: 1px solid var(--danger); }

  /* notes timeline */
  .timeline { margin: 0 0 12px; padding: 0; list-style: none; position: relative; }
  .timeline::before {
    content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px;
    width: 2px; background: var(--border); border-radius: 2px;
  }
  .timeline li { position: relative; padding: 0 0 10px 22px; font-size: 14px; }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li::before {
    content: ""; position: absolute; left: 1px; top: 7px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--surface-2); border: 2px solid var(--faint);
  }
  .timeline li:last-child::before { border-color: var(--accent); background: var(--accent-soft); }
  .timeline .t { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; display: block; line-height: 1.3; margin-bottom: 1px; }
  .notes-empty { color: var(--faint); font-size: 13px; margin: 0 0 12px; }

  .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 9px; }
  .chip {
    border: 1px dashed var(--border); background: none; color: var(--muted);
    border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer;
  }
  .chip:active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  form.note-form { display: flex; gap: 8px; }
  .note-form input {
    flex: 1; font-size: 15px; padding: 10px 12px; border-radius: 11px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink); min-width: 0;
  }
  .note-form input::placeholder { color: var(--faint); }
  .note-form button[type="submit"] {
    font-size: 14px; font-weight: 600; padding: 10px 18px; border-radius: 11px;
    border: none; background: var(--ink); color: var(--bg); cursor: pointer; flex-shrink: 0;
  }

  .empty {
    text-align: center; color: var(--faint); padding: 64px 20px;
    border: 1.5px dashed var(--border); border-radius: 16px; font-size: 14px; margin-top: 14px;
  }
  .empty .big { font-size: 34px; margin-bottom: 8px; }

  /* ---- footer ---- */
  footer.foot {
    margin-top: 26px; text-align: center; color: var(--faint); font-size: 12.5px;
    display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .foot button { border: none; background: none; color: var(--muted); font-size: 12.5px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 4px; }

  /* ---- FAB ---- */
  .fab {
    position: fixed; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 6;
    background: var(--accent); color: var(--accent-ink); border: none; cursor: pointer;
    border-radius: 999px; padding: 14px 22px 14px 18px;
    font-size: 15.5px; font-weight: 700; letter-spacing: .02em;
    box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 45%, transparent);
    display: flex; align-items: center; gap: 6px;
  }
  .fab:active { transform: scale(.97); }
  .fab .plus { font-size: 19px; line-height: 1; font-weight: 600; }

  /* ---- dialog / bottom sheet ---- */
  dialog {
    border: none; border-radius: 18px; padding: 0;
    background: var(--surface); color: var(--ink);
    width: min(440px, calc(100vw - 32px)); box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgba(18,13,22,.5); }
  .dlg-inner { padding: 22px 20px calc(18px + env(safe-area-inset-bottom)); }
  .dlg-inner h2 { margin: 0 0 16px; font-size: 18px; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  .field input {
    width: 100%; font-size: 16px; padding: 11px 12px; border-radius: 11px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--ink);
  }
  .field input:focus, .note-form input:focus, .search:focus-within {
    outline: 2px solid var(--accent); outline-offset: -1px;
  }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button {
    font-size: 13.5px; padding: 8px 13px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); cursor: pointer;
  }
  .seg button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .dlg-actions { display: flex; gap: 10px; margin-top: 20px; }
  .dlg-actions .cancel {
    flex: 1; font-size: 15px; padding: 11px; border-radius: 11px;
    border: 1px solid var(--border); background: none; color: var(--muted); cursor: pointer;
  }
  .dlg-actions .save {
    flex: 2; font-size: 15px; font-weight: 700; padding: 11px; border-radius: 11px;
    border: none; background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  @media (max-width: 520px) {
    dialog {
      margin: auto 0 0; width: 100vw; max-width: 100vw;
      border-radius: 20px 20px 0 0;
    }
  }

  /* ---- toast ---- */
  .toast {
    position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(8px); z-index: 9;
    background: var(--ink); color: var(--bg); font-size: 14px;
    padding: 9px 18px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  button:focus-visible, .card-main:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .toast, .fab { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>线索跟进<span class="spark">·</span>星探本</h1>
    <div class="sub" id="summary"></div>
  </header>

  <div class="toolbar">
    <div class="search" id="searchBox">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16.5" y2="16.5"></line></svg>
      <input id="q" placeholder="搜名字、联系方式、渠道、跟进内容" autocomplete="off">
      <button class="clear" id="qClear" aria-label="清除搜索">✕</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>

  <div class="list" id="list"></div>

  <footer class="foot">
    <span id="footCount"></span>
    <button id="btnExport">导出备份</button>·
    <button id="btnImport">导入备份</button>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
  </footer>
</div>

<button class="fab" id="btnAdd"><span class="plus">＋</span>新增线索</button>
<div class="toast" id="toast"></div>

<dialog id="dlg">
  <form class="dlg-inner" id="leadForm" method="dialog">
    <h2 id="dlgTitle">新增线索</h2>
    <div class="field">
      <label for="fName">名字 *</label>
      <input id="fName" required maxlength="30" placeholder="例：小雨" autocomplete="off">
    </div>
    <div class="field">
      <label for="fContact">联系方式</label>
      <input id="fContact" maxlength="60" placeholder="微信 / 手机号 / 抖音号" autocomplete="off">
    </div>
    <div class="field">
      <label for="fSource">来源渠道</label>
      <input id="fSource" maxlength="30" list="srcList" placeholder="例：抖音 / 线下地推" autocomplete="off">
      <datalist id="srcList">
        <option value="抖音"></option><option value="快手"></option>
        <option value="小红书"></option><option value="B站"></option>
        <option value="线下地推"></option><option value="朋友介绍"></option>
      </datalist>
    </div>
    <div class="field">
      <label>当前状态</label>
      <div class="seg" id="segStatus"></div>
    </div>
    <div class="dlg-actions">
      <button type="button" class="cancel" id="btnCancel">取消</button>
      <button type="submit" class="save" id="btnSave">保存</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  const KEY = 'scout-leads-v1';
  const STATUSES = ['待联系', '已联系', '已约面', '已签约', '不合适'];
  const CLS = { '待联系': 's1', '已联系': 's2', '已约面': 's3', '已签约': 's4', '不合适': 's5' };
  const AVATARS = [
    'linear-gradient(135deg,#E0559B,#9B2C7E)',
    'linear-gradient(135deg,#F0A03A,#D9600F)',
    'linear-gradient(135deg,#3E8BC9,#2456A0)',
    'linear-gradient(135deg,#37985F,#1F6B40)',
    'linear-gradient(135deg,#8A63D2,#5B3AA6)',
    'linear-gradient(135deg,#D95A4E,#A83228)'
  ];
  const QUICK = ['加上微信了', '已私信，等回复', '没回应，过两天再试'];

  let leads = [];
  try { leads = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { leads = []; }
  leads.forEach(l => { if (l.star === undefined) l.star = false; if (!Array.isArray(l.notes)) l.notes = []; });

  let filter = '全部';
  let query = '';
  let expanded = new Set();
  let confirming = null;
  let editingId = null;
  let formStatus = '待联系';

  const $ = (id) => document.getElementById(id);
  const save = () => localStorage.setItem(KEY, JSON.stringify(leads));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const pad = (n) => String(n).padStart(2, '0');
  function fmt(ts) {
    const d = new Date(ts), now = new Date();
    const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = (day(now) - day(d)) / 86400000;
    const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    if (diff === 0) return '今天 ' + hm;
    if (diff === 1) return '昨天 ' + hm;
    const md = (d.getMonth() + 1) + '月' + d.getDate() + '日';
    return (d.getFullYear() !== now.getFullYear() ? d.getFullYear() + '年' : '') + md + ' ' + hm;
  }
  const avatarOf = (name) => {
    let h = 0; for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    return AVATARS[h % AVATARS.length];
  };
  const lastActive = (l) => l.notes.length ? l.notes[l.notes.length - 1].t : l.createdAt;

  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }

  function copyText(text) {
    const done = () => toast('已复制：' + text);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    } else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败，请长按选择'); }
    ta.remove();
  }

  function matches(l) {
    if (!query) return true;
    const q = query.toLowerCase();
    return [l.name, l.contact, l.source, ...l.notes.map(n => n.text)]
      .some(v => v && String(v).toLowerCase().includes(q));
  }

  function render() {
    const wk = Date.now() - 7 * 86400000;
    $('summary').textContent = leads.length
      ? '共 ' + leads.length + ' 条线索 · 本周新增 ' + leads.filter(l => l.createdAt >= wk).length
        + ' · 待联系 ' + leads.filter(l => l.status === '待联系').length
      : '星探线索都记在这，别让苗子溜了';
    $('footCount').textContent = '共 ' + leads.length + ' 条 ·';

    const tabs = ['全部'].concat(STATUSES);
    $('tabs').innerHTML = tabs.map(t => {
      const n = t === '全部' ? leads.length : leads.filter(l => l.status === t).length;
      const dot = t === '全部' ? '' : '<span class="dot" style="background:var(--' + CLS[t] + '-dot)"></span>';
      return '<button class="tab' + (filter === t ? ' active' : '') + '" data-tab="' + t + '">'
        + dot + esc(t) + ' <span class="n">' + n + '</span></button>';
    }).join('');

    const shown = leads
      .filter(l => (filter === '全部' || l.status === filter) && matches(l))
      .sort((a, b) => (b.star - a.star) || (lastActive(b) - lastActive(a)));

    if (!shown.length) {
      $('list').innerHTML = '<div class="empty"><div class="big">' + (query ? '🔍' : '🎤') + '</div>'
        + (query ? '没搜到「' + esc(query) + '」相关的线索'
           : leads.length ? '这个状态下暂时没有线索'
           : '还没有线索，点右下角「＋ 新增线索」<br>记下第一个苗子')
        + '</div>';
      return;
    }

    $('list').innerHTML = shown.map(l => {
      const open = expanded.has(l.id);
      const last = l.notes[l.notes.length - 1];
      const meta = [
        l.contact ? esc(l.contact) : '',
        l.source ? '<span class="src">' + esc(l.source) + '</span>' : ''
      ].filter(Boolean).join('');

      let detail = '';
      if (open) {
        const contactRow = l.contact
          ? '<div class="contact-row">联系方式 <span class="val">' + esc(l.contact) + '</span>'
            + '<button class="btn-copy" data-copy="' + l.id + '">复制</button></div>'
          : '';
        const items = l.notes.length
          ? '<ul class="timeline">' + l.notes.map(n =>
              '<li><span class="t">' + fmt(n.t) + '</span>' + esc(n.text) + '</li>').join('') + '</ul>'
          : '<p class="notes-empty">还没有跟进记录，记一笔吧</p>';
        const opts = STATUSES.map(s =>
          '<option' + (s === l.status ? ' selected' : '') + '>' + s + '</option>').join('');
        const chips = QUICK.map(c =>
          '<button type="button" class="chip" data-chip="' + esc(c) + '">' + esc(c) + '</button>').join('');
        detail =
          '<div class="card-detail">'
          + contactRow
          + '<div class="detail-bar">'
          +   '<label>状态 <select class="status-select" data-status="' + l.id + '">' + opts + '</select></label>'
          +   '<span class="spacer"></span>'
          +   '<button class="btn-mini" data-edit="' + l.id + '">编辑</button>'
          +   '<button class="btn-mini' + (confirming === l.id ? ' confirming' : '') + '" data-del="' + l.id + '">'
          +     (confirming === l.id ? '确认删除？' : '删除') + '</button>'
          + '</div>'
          + items
          + '<form class="note-form" data-note="' + l.id + '">'
          +   '<div style="flex:1;min-width:0"><div class="chips">' + chips + '</div>'
          +   '<input maxlength="200" placeholder="添加跟进记录…" autocomplete="off" style="width:100%"></div>'
          +   '<button type="submit" style="align-self:flex-end">记录</button>'
          + '</form>'
          + '</div>';
      }

      return '<div class="card' + (l.star ? ' starred' : '') + '">'
        + '<div class="card-main" data-toggle="' + l.id + '" tabindex="0" role="button" aria-expanded="' + open + '">'
        +   '<div class="avatar" style="background:' + avatarOf(l.name) + '">' + esc(String(l.name).slice(0, 1)) + '</div>'
        +   '<div class="card-body">'
        +     '<div class="card-row1"><span class="lead-name">' + esc(l.name) + '</span>'
        +       '<span class="pill ' + CLS[l.status] + '"><span class="dot"></span>' + l.status + '</span></div>'
        +     (meta ? '<div class="card-row2">' + meta + '</div>' : '')
        +     (open || !last ? '' : '<div class="note-preview"><b>' + fmt(last.t) + '</b> ' + esc(last.text) + '</div>')
        +   '</div>'
        +   '<button class="btn-star' + (l.star ? ' on' : '') + '" data-star="' + l.id + '" aria-label="星标">'
        +     (l.star ? '★' : '☆') + '</button>'
        + '</div>'
        + detail
        + '</div>';
    }).join('');
  }

  /* ---- delegated events ---- */
  document.addEventListener('click', (e) => {
    const tab = e.target.closest('[data-tab]');
    if (tab) { filter = tab.dataset.tab; confirming = null; render(); return; }

    const star = e.target.closest('[data-star]');
    if (star) {
      const l = leads.find(x => x.id === star.dataset.star);
      if (l) { l.star = !l.star; save(); render(); }
      return;
    }

    const cp = e.target.closest('[data-copy]');
    if (cp) {
      const l = leads.find(x => x.id === cp.dataset.copy);
      if (l && l.contact) copyText(l.contact);
      return;
    }

    const ed = e.target.closest('[data-edit]');
    if (ed) { openDialog(ed.dataset.edit); return; }

    const del = e.target.closest('[data-del]');
    if (del) {
      const id = del.dataset.del;
      if (confirming === id) {
        leads = leads.filter(l => l.id !== id);
        expanded.delete(id); confirming = null; save(); toast('已删除');
      } else confirming = id;
      render(); return;
    }

    const chip = e.target.closest('[data-chip]');
    if (chip) {
      const input = chip.closest('.note-form').querySelector('input');
      input.value = chip.dataset.chip; input.focus();
      return;
    }

    const tog = e.target.closest('[data-toggle]');
    if (tog) {
      const id = tog.dataset.toggle;
      expanded.has(id) ? expanded.delete(id) : expanded.add(id);
      confirming = null; render(); return;
    }

    if (!e.target.closest('.card-detail')) confirming = null;
  });

  document.addEventListener('keydown', (e) => {
    const tog = e.target.closest && e.target.closest('[data-toggle]');
    if (tog && (e.key === 'Enter' || e.key === ' ') && e.target === tog) {
      e.preventDefault(); tog.click();
    }
  });

  document.addEventListener('change', (e) => {
    const sel = e.target.closest('[data-status]');
    if (sel) {
      const l = leads.find(x => x.id === sel.dataset.status);
      if (l) { l.status = sel.value; save(); render(); toast('状态已更新为「' + sel.value + '」'); }
    }
  });

  document.addEventListener('submit', (e) => {
    const nf = e.target.closest('[data-note]');
    if (nf) {
      e.preventDefault();
      const input = nf.querySelector('input');
      const text = input.value.trim();
      if (!text) return;
      const l = leads.find(x => x.id === nf.dataset.note);
      if (l) { l.notes.push({ t: Date.now(), text }); save(); render(); }
    }
  });

  /* ---- search ---- */
  $('q').addEventListener('input', () => {
    query = $('q').value.trim();
    $('searchBox').classList.toggle('has-q', !!query);
    render();
  });
  $('qClear').addEventListener('click', () => {
    $('q').value = ''; query = '';
    $('searchBox').classList.remove('has-q'); render();
  });

  /* ---- add / edit dialog ---- */
  const dlg = $('dlg');
  function renderSeg() {
    $('segStatus').innerHTML = STATUSES.map(s =>
      '<button type="button" class="' + (formStatus === s ? 'on' : '') + '" data-seg="' + s + '">' + s + '</button>').join('');
  }
  $('segStatus').addEventListener('click', (e) => {
    const b = e.target.closest('[data-seg]');
    if (b) { formStatus = b.dataset.seg; renderSeg(); }
  });

  function openDialog(id) {
    editingId = id || null;
    const l = id ? leads.find(x => x.id === id) : null;
    $('dlgTitle').textContent = l ? '编辑线索' : '新增线索';
    $('btnSave').textContent = l ? '保存修改' : '保存';
    $('fName').value = l ? l.name : '';
    $('fContact').value = l ? l.contact : '';
    $('fSource').value = l ? l.source : '';
    formStatus = l ? l.status : '待联系';
    renderSeg();
    dlg.showModal();
    if (!l) $('fName').focus();
  }
  $('btnAdd').addEventListener('click', () => openDialog(null));
  $('btnCancel').addEventListener('click', () => dlg.close());

  $('leadForm').addEventListener('submit', (e) => {
    const name = $('fName').value.trim();
    if (!name) { e.preventDefault(); return; }
    const contact = $('fContact').value.trim();
    const source = $('fSource').value.trim();
    if (editingId) {
      const l = leads.find(x => x.id === editingId);
      if (l) { l.name = name; l.contact = contact; l.source = source; l.status = formStatus; }
      toast('已保存修改');
    } else {
      const id = 'L' + Date.now() + Math.random().toString(36).slice(2, 6);
      leads.push({ id, name, contact, source, status: formStatus, star: false, createdAt: Date.now(), notes: [] });
      expanded.add(id);
      toast('已添加「' + name + '」');
    }
    save(); render();
  });

  /* ---- export / import ---- */
  $('btnExport').addEventListener('click', () => {
    if (!leads.length) { toast('还没有数据可导出'); return; }
    const blob = new Blob([JSON.stringify(leads, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    const d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = '线索备份-' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('已导出 ' + leads.length + ' 条线索');
  });
  $('btnImport').addEventListener('click', () => $('fileImport').click());
  $('fileImport').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error('bad');
        const existing = new Set(leads.map(l => l.id));
        let added = 0;
        data.forEach(l => {
          if (l && l.name && !existing.has(l.id)) {
            leads.push({
              id: l.id || 'L' + Date.now() + Math.random().toString(36).slice(2, 6),
              name: String(l.name), contact: String(l.contact || ''), source: String(l.source || ''),
              status: STATUSES.includes(l.status) ? l.status : '待联系',
              star: !!l.star, createdAt: l.createdAt || Date.now(),
              notes: Array.isArray(l.notes) ? l.notes.filter(n => n && n.text).map(n => ({ t: n.t || Date.now(), text: String(n.text) })) : []
            });
            added++;
          }
        });
        save(); render();
        toast(added ? '成功导入 ' + added + ' 条线索' : '没有新线索（已存在的会跳过）');
      } catch (err) { toast('导入失败：文件格式不对'); }
      e.target.value = '';
    };
    reader.readAsText(f);
  });

  render();
})();
</script>
</body>
</html>
