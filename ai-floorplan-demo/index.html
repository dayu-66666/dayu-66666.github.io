<script>

const redesigned = 'assets/redesign-plan.png';

let currentStep = 0;
let sourceMode = 'choose';

let sentAnalysis='';
let adjustment='',revision=0,diagnosisSent=false,leadReceived=false,planSent=false;

function escapeHTML(value) { return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
function toast(message) { const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2000); }
function guideTime(){return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});}
function appendGuideEvent(message,tone=''){
  const feed=document.getElementById('guide-thread');
  feed.insertAdjacentHTML('beforeend','<div class="guide-event '+tone+'"><span>'+escapeHTML(message)+' · '+guideTime()+'</span></div>');
  const scroll=document.getElementById('chat-stream');scroll.scrollTop=scroll.scrollHeight;
}
function appendGuideBubble(title,message,outbound=false){
  const feed=document.getElementById('guide-thread');
  feed.insertAdjacentHTML('beforeend','<div class="guide-bubble '+(outbound?'outbound':'')+'"><strong>'+escapeHTML(title)+'</strong><div>'+escapeHTML(message)+'</div><small>'+guideTime()+'</small></div>');
  const scroll=document.getElementById('chat-stream');scroll.scrollTop=scroll.scrollHeight;
}
function resetGuideThread(){document.getElementById('guide-thread').innerHTML='';}
function phases(step) { const labels=['选户型图','生成解读','客户留资','发送方案'];return '<div class="phasebar">'+labels.map((label,i)=>'<div class="phase '+(i+1<step?'done ':'')+(i+1===step?'active':'')+'"><span class="circle">'+(i+1<step?'✓':i+1)+'</span><span>'+label+'</span></div>'+(i<labels.length-1?'<span class="phase-line"></span>':'')).join('')+'</div>'; }
function toolbar(title,sub='') { return '<div class="pane-toolbar"><button data-action="back-app">‹ 返回</button><strong>'+title+'</strong><small>'+sub+'</small></div>'; }
function sourcePanel() {
  let body = '';
  if (sourceMode === 'choose') body = '<div class="panel-card"><div class="card-title">选择客户的原始平面图</div><div class="help">先选择图片来源，再生成户型解读意见。</div><div class="source-options"><button class="source-option" data-action="pick-album"><span class="option-icon">▧</span><span><strong>从相册上传</strong><small>选择本机保存的户型平面图</small></span><span class="chevron">›</span></button><button class="source-option" data-action="show-records"><span class="option-icon">☏</span><span><strong>读取聊天记录图片</strong><small>查看当前客户发过的图片</small></span><span class="chevron">›</span></button></div></div>';
  if (sourceMode === 'records') body = '<div class="panel-card"><div class="card-title">客户聊天记录中的图片<small>1 张</small></div><div class="help">当前客户 · 20:18 发送的平面图</div><img class="record-image" src="'+original+'" alt="聊天记录中的原始户型图"><div class="source-confirm"><button class="primary" data-action="use-record">使用这张平面图　›</button><button class="secondary" data-action="choose-source">返回选择来源</button></div></div>';
  return toolbar('AI户型诊断设计','第 1 步 · 选择平面图')+phases(1)+body;
}
function render() {
  legacy.hidden=true;pane.hidden=false;
  let html='';
  if(currentStep===1) html=sourcePanel();
  if(currentStep===2) html=toolbar('户型解读意见','第 2 步 · 图文分析')+phases(2)+'<div class="panel-card"><div class="card-title">原始户型图文解读<small>✓ 演示结果</small></div><figure class="analysis-figure"><img src="'+original+'" alt="带文字标注的原始户型分析图"><figcaption>图一 · 原始户型图及调整建议标注</figcaption></figure><div class="analysis-caption">结合原始平面，先看到了三处可重点沟通的改造机会：</div><ul class="analyze-list"><li><span class="numb">01</span><span><b>空中花园与主卧</b><br>打通后可形成主卧套间，补足收纳与独立卫浴。</span></li><li><span class="numb">02</span><span><b>客餐厅与阳台</b><br>去掉局部隔断，扩大公共活动空间。</span></li><li><span class="numb">03</span><span><b>次卧门向与衣帽间</b><br>调整门方向，改善动线并保护卧室隐私。</span></li></ul><div class="help">这一步先把解读摘要发给客户。完整交付资料在留资后包含图一和图二两张图片。</div><button class="primary" data-action="send-diagnosis">发送初步解读给客户　›</button><button class="secondary" data-action="back-source">返回选择平面图</button></div>';
  if(currentStep===3||currentStep===4) html=toolbar('等待客户领取','第 3 步 · 客户留资')+phases(3)+'<div class="panel-card"><div class="success-banner">✓ 图文解读已发送给客户</div><div class="card-title">'+(currentStep===4?'客户正在填写联系方式':'等待客户领取方案')+'</div><div class="analysis-caption">客户在手机端领取方案并提交联系方式后，导购端会进入第四步。</div><button class="primary" data-action="open-customer">打开客户手机端　›</button></div>';

  if(currentStep===5) {const masked=lead.phone.slice(0,3)+'****'+lead.phone.slice(-4);html=toolbar('交付资料确认','第 4 步 · 审核两张图')+phases(4)+'<div class="panel-card"><div class="card-title">即将发送给客户<small>两张图片</small></div><div class="package-grid"><div class="package-card"><img src="'+original+'" alt="原始户型图与诊断标注"><strong>图一 · 原始户型分析</strong><small>问题与调整方向</small></div><div class="package-card"><img src="'+redesigned+'" alt="优化后的设计平面图"><strong>图二 · 优化设计平面</strong><small>改造后的布局建议</small></div></div><div class="help">客户资料：'+masked+' · '+escapeHTML(lead.city)+(lead.community?' · '+escapeHTML(lead.community):'')+'</div><button class="primary" data-action="send-plan">发送这两张图片给客户　›</button></div>'; }
  if(currentStep===6) html=toolbar('两张图片已发送','流程完成')+phases(5)+'<div class="panel-card"><div class="done-mark">✓</div><div class="done-title">图一、图二已发送给客户</div><button class="secondary" data-action="open-customer">查看客户手机端</button><button class="primary" data-action="restart">重新演示</button></div>';
  if(currentStep===7) html=toolbar('客户资料已收到','第 4 步 · 生成方案')+phases(4)+'<div class="panel-card"><div class="success-banner">✓ 客户已提交联系方式</div><div class="analysis-caption">'+escapeHTML(lead.phone.slice(0,3)+'****'+lead.phone.slice(-4))+' · '+escapeHTML(lead.city)+'</div><button class="primary" data-action="generate-plan">生成优化平面方案　›</button></div>';
  if(currentStep===2){
    const adjustmentUI='<div class="adjust-box"><label for="adjustment">调整要求</label><textarea id="adjustment" placeholder="例如：保留阳台隔断，增加主卧收纳">'+escapeHTML(adjustment)+'</textarea><button class="secondary" data-action="revise">按要求重新生成</button></div>';
    html=html.replace('<button class="primary" data-action="send-diagnosis">',adjustmentUI+'<button class="primary" data-action="send-diagnosis">');
    if(revision){
      if(/保留.*(阳台|隔断)/.test(adjustment)) html=html.replace('去掉局部隔断，扩大公共活动空间。','保留阳台隔断，优先优化客餐厅内部的家具布局与动线。');
      if(/收纳/.test(adjustment)) html=html.replace('打通后可形成主卧套间，补足收纳与独立卫浴。','优先补充主卧收纳，结合家庭需求布置衣柜与套间功能。');
      html=html.replace('<ul class="analyze-list">','<div class="revision">第 '+(revision+1)+' 版 · 已补充调整要求：'+escapeHTML(adjustment)+'</div><ul class="analyze-list">');
      html=html.replace('图一 · 原始户型图及调整建议标注','图一 · 示例图；本次调整以更新后的文字意见为准');
    }
  }
  pane.innerHTML=html;rightContent.scrollTop=0;
}
function resetSource() { if(uploadedObjectUrl) URL.revokeObjectURL(uploadedObjectUrl);uploadedObjectUrl='';sourceUrl='';sourceName='';sourceMode='choose';document.getElementById('file-input').value=''; }
function closePlugin() {currentStep=0;pane.hidden=true;legacy.hidden=false;entry.classList.remove('active');rightContent.scrollTop=0;}
entry.addEventListener('click',()=>{diagnosisSent=false;leadReceived=false;planSent=false;adjustment='';revision=0;lead={phone:'',city:'',community:''};document.getElementById('customer-thread').innerHTML='';resetGuideThread();resetSource();currentStep=1;entry.classList.add('active');render();});
document.getElementById('bind-account').addEventListener('click',()=>toast('演示：可使用京东账号、昵称或手机号绑定'));
rightContent.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');if(!button)return;
  const action=button.dataset.action;if(action==='open-customer'){openCustomer();return;}
  if(action==='back-app'){closePlugin();return;}if(action==='restart'){diagnosisSent=false;leadReceived=false;planSent=false;adjustment='';revision=0;lead={phone:'',city:'',community:''};document.getElementById('customer-thread').innerHTML='';resetGuideThread();resetSource();currentStep=1;render();return;}
  if(action==='generate-plan'){appendGuideEvent('导购已开始生成客户专属优化方案');currentStep=5;render();return;}if(action==='revise'){const value=document.getElementById('adjustment').value.trim();if(!value){toast('请填写需要调整的内容');return;}adjustment=value;revision++;render();return;}if(action==='pick-album'){document.getElementById('file-input').click();return;}
  if(action==='show-records'){sourceMode='records';render();return;}
  if(action==='choose-source'){resetSource();render();return;}
  if(action==='use-record'){sourceUrl=original;sourceName='客户发送的户型图.jpg';currentStep=2;render();return;}
  if(action==='analyze'){if(!sourceUrl){toast('请先选择平面图');return;}currentStep=2;render();return;}
  if(action==='back-source'){sourceMode='choose';currentStep=1;render();return;}
  if(action==='send-diagnosis'){sentAnalysis=document.querySelector('.analyze-list').outerHTML;diagnosisSent=true;appendGuideBubble('导购发送','户型初步解读已发送给客户',true);currentStep=leadReceived?7:3;render();renderConversation();appendGuideEvent('客户已打开户型解读','success');return;}
  if(action==='back-diagnosis'){currentStep=2;render();return;}
  if(action==='send-plan'){planSent=true;appendGuideBubble('导购发送','原始户型分析图和优化设计平面图已发送',true);currentStep=6;render();renderConversation();appendGuideEvent('客户已收到两张户型方案图片','success');}
});
document.getElementById('file-input').addEventListener('change',event=>{
  const file=event.target.files&&event.target.files[0];if(!file)return;
  if(!file.type.startsWith('image/')){toast('请选择图片文件');return;}
  if(uploadedObjectUrl) URL.revokeObjectURL(uploadedObjectUrl);
  uploadedObjectUrl=URL.createObjectURL(file);sourceUrl=uploadedObjectUrl;sourceName=file.name;currentStep=2;render();
});

function renderConversation(){
 const thread=document.getElementById('customer-thread');let content='';
 if(diagnosisSent) content='<article class="thread-message"><h3>您的户型初步解读</h3><img src="'+original+'" alt="原始户型分析图">'+sentAnalysis+''+(adjustment?'<div class="revision">本次调整：'+escapeHTML(adjustment)+'</div>':'')+'<button class="primary" id="claim-plan" '+(leadReceived?'disabled':'')+'>'+(leadReceived?'已领取方案':'领取专属优化方案')+'</button></article>';
 if(leadReceived) content+='<article class="thread-message customer"><h3>已提交联系方式</h3><div>'+escapeHTML(lead.phone.slice(0,3)+'****'+lead.phone.slice(-4))+' · '+escapeHTML(lead.city)+'</div><div class="help">等待设计师整理优化方案</div></article>';
 if(planSent) content+='<article class="thread-message"><h3>您的两张户型资料已送达</h3><div class="thread-image"><strong>图一 · 原始户型分析</strong><img src="'+original+'" alt="交付图一"></div><div class="thread-image"><strong>图二 · 优化设计平面</strong><img src="'+redesigned+'" alt="交付图二"></div>'+(adjustment?'<div class="revision">补充调整意见：'+escapeHTML(adjustment)+'</div>':'')+'<p>您看看这些调整是否符合家人的使用习惯，我们可以继续沟通。</p></article>';
 thread.innerHTML=content;openCustomer();const scroll=document.getElementById('phone-scroll');scroll.scrollTop=planSent?scroll.scrollHeight:0;
}
document.getElementById('customer-thread').addEventListener('click',event=>{
 if(event.target.id==='fill-example'){document.getElementById('customer-phone').value='13800002688';document.getElementById('customer-city').value='上海';document.getElementById('customer-consent').checked=true;document.getElementById('customer-error').textContent='';return;}if(event.target.id==='claim-plan'){
  if(document.getElementById('customer-lead'))return;
  appendGuideEvent('客户点击“确认领取专属优化方案”','attention');
  currentStep=4;render();
  document.getElementById('customer-thread').insertAdjacentHTML('beforeend','<form class="thread-message customer" id="customer-lead"><h3>领取专属优化方案</h3><button type="button" class="secondary" id="fill-example">填入示例资料</button><label class="lead-field">手机号<input id="customer-phone" type="tel" inputmode="numeric" maxlength="11" placeholder="演示填写任意11位数字" required></label><label class="lead-field">所在城市<input id="customer-city" placeholder="请输入所在城市" required></label><label class="consent"><input id="customer-consent" type="checkbox" required><span>同意设计师为本次户型方案联系本人</span></label><div class="help" id="customer-error" role="alert"></div><button class="primary" type="submit">提交并领取方案</button></form>');
  document.getElementById('customer-lead').scrollIntoView({block:'nearest'});
 }
});
document.getElementById('customer-thread').addEventListener('submit',event=>{
 event.preventDefault();const phone=document.getElementById('customer-phone').value.trim();
 if(!/^\d{11}$/.test(phone)){document.getElementById('customer-error').textContent='演示请输入11位数字，或点击“填入示例资料”';return;}
 lead={phone,city:document.getElementById('customer-city').value.trim(),community:''};leadReceived=true;appendGuideBubble('客户提交资料','手机号 '+phone.slice(0,3)+'****'+phone.slice(-4)+'，所在城市 '+(lead.city||'待补充'));appendGuideEvent('客户已确认授权联系，导购可继续生成方案','success');currentStep=7;render();renderConversation();document.getElementById('customer-modal').close();toast('客户资料已收到，已进入第四步');
});

function openCustomer(){const modal=document.getElementById('customer-modal');if(!modal.open)modal.showModal();}
document.getElementById('close-customer').addEventListener('click',()=>document.getElementById('customer-modal').close());
</script>
</body>
</html>
